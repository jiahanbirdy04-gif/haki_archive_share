<!DOCTYPE html>
<html lang="en">
<head>

<title>Haki's Archive (Read-Only)</title>
<style>

.page { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }

.profile-row { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.section-title { font-family: Georgia, 'Times New Roman', serif; color: #3A2E1E; font-size: 20px; font-weight: 700; margin: 0 0 10px; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { position: relative; background: rgba(58,46,30,0.03); border: 1px solid rgba(58,46,30,0.10);
  border-radius: 14px; overflow: hidden; cursor: pointer; }
.card-perf { height: 4px; background: repeating-linear-gradient(90deg,#D9C79C 0 4px,transparent 4px 8px); }

.poster-img { width: 100%; height: 100%; object-fit: cover; }

.card-title { color: #3A2E1E; font-size: 14px; font-weight: 600; margin-bottom: 2px; }

.badge-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

  border: 1px solid #DECBA0; flex-shrink: 0; }

.badge-chip { font-size: 13px; }
.badge-chip-lg { font-size: 11px; background: rgba(201,164,97,0.1); border: 1px solid #D9C79C;
  border-radius: 20px; padding: 4px 9px; color: #4F4030; white-space: nowrap; display: inline-block; margin: 2px; }
.card-actions { display: flex; gap: 4px; padding: 0 10px 8px; }

.search-row { display: flex; gap: 8px; margin-bottom: 18px; }
.search-box { flex: 1; display: flex; align-items: center; gap: 8px; background: rgba(58,46,30,0.035);

.page-title { font-family: Georgia, 'Times New Roman', serif; color: #3A2E1E; font-size: 26px; margin-bottom: 18px; }
.back-btn { background: none; border: none; color: #C9A461; font-size: 13px; cursor: pointer; margin-bottom: 14px; font-weight: 600; }

.detail-banner { position: relative; border-radius: 16px; overflow: hidden; background: #F0E6D2;
  min-height: 220px; margin-bottom: 16px; display: flex; align-items: flex-end; }
.detail-banner-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
.detail-banner.lightbox-trigger { cursor: pointer; }
.insta-link { color: #9C6B21; text-decoration: underline; cursor: pointer; position: relative; z-index: 3; }
.detail-banner-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(250,244,233,0.97), rgba(250,244,233,0.15)); }
.detail-banner-text { position: relative; padding: 20px; z-index: 2; }
.detail-title { font-family: Georgia, 'Times New Roman', serif; color: #3A2E1E; font-size: 26px; margin: 0 0 2px; }
.detail-native { color: #786646; font-size: 13px; margin: 0 0 6px; }
.detail-meta { color: #8C7A5A; font-size: 12px; margin: 0 0 8px; font-family: 'Courier New', monospace; }
.detail-actions { display: flex; align-items: center; gap: 4px; margin-bottom: 18px; }
.icon-only-btn { background: rgba(58,46,30,0.045); border: 1px solid #DECBA0; border-radius: 8px; padding: 8px;
  color: #4F4030; cursor: pointer; font-size: 14px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cast-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cast-card { background: rgba(58,46,30,0.035); border: 1px solid rgba(58,46,30,0.10); border-radius: 12px;
  overflow: hidden; cursor: pointer; text-align: center; padding-bottom: 8px; }
.cast-pic { background: #F0E6D2; height: 90px; display: flex; align-items: center; justify-content: center; font-size: 22px; overflow: hidden; }
.cast-pic img { width: 100%; height: 100%; object-fit: cover; }
.cast-name { color: #3A2E1E; font-size: 11.5px; font-weight: 600; margin-top: 6px; padding: 0 4px; }
.cast-sub { color: #8C7A5A; font-size: 10px; padding: 0 4px; }
.gallery-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.mv-slideshow { position: relative; width: 100%; height: 280px; border-radius: 12px; overflow: hidden; background: #F0E6D2; cursor: pointer; }
.mv-slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.1s ease; }
.mv-slide.active { opacity: 1; }
.mv-slideshow-dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; z-index: 2; }
.mv-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.55); transition: all 0.3s ease; }
.mv-dot.active { background: #FAF4E9; width: 18px; border-radius: 3px; }

.gallery-thumb { height: 110px; border-radius: 8px; flex-shrink: 0; object-fit: cover; cursor: pointer; }
.drag-handle { position: absolute; top: 2px; left: 2px; background: rgba(0,0,0,0.5); color: #C9A461;
  border-radius: 6px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
  font-size: 13px; cursor: grab; z-index: 2; touch-action: none; -webkit-touch-callout: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.cast-card.dragging-card { opacity: 0.5; box-shadow: 0 0 0 2px #C9A461; z-index: 5; }
.lightbox-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 300; display: flex;
  align-items: center; justify-content: center; padding: 16px; }
.lightbox-overlay img { max-width: 100%; max-height: 85vh; border-radius: 8px; object-fit: contain;
  touch-action: none; transform-origin: center center; user-select: none; -webkit-user-drag: none; }
.lightbox-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.1); border: none;
  color: #3A2E1E; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
.lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1);

.lightbox-prev { left: 12px; }
.lightbox-next { right: 12px; }
.comment-input-row { display: flex; gap: 8px; }
.comment-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #E3D5B4; font-size: 13px; }

.rating-stars { display: flex; align-items: center; gap: 5px; margin-top: 4px; flex-wrap: wrap; }

.rating-stars .rating-label { font-family: 'Courier New', monospace; font-size: 12px; font-weight: 700; color: #B8862E; }
.rating-stars.lg .stars { font-size: 18px; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; display: flex;
  align-items: flex-end; justify-content: center; }
.modal { background: #F0E6D2; border-top: 1px solid #DECBA0; border-radius: 16px 16px 0 0;
  width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto; padding: 20px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-title { font-family: Georgia, 'Times New Roman', serif; color: #3A2E1E; font-size: 22px; margin: 0; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-wrap { display: flex; flex-direction: column; gap: 4px; }
.field-wrap.full { grid-column: 1 / -1; }
.field-label { color: #8C7A5A; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
.field-hint { text-transform: none; color: #5E5140; font-size: 10.5px; letter-spacing: 0; }
.field-input { background: rgba(58,46,30,0.035); border: 1px solid #DECBA0; border-radius: 8px;
  padding: 8px 10px; color: #3A2E1E; font-size: 13px; outline: none; width: 100%; }
textarea.field-input { resize: vertical; }
.badge-picker { margin-top: 14px; }
.badge-btn { font-size: 11px; background: rgba(201,164,97,0.1); border-radius: 20px; padding: 4px 9px;
  color: #4F4030; white-space: nowrap; margin: 2px; cursor: pointer; border: 1px solid #D9C79C; opacity: 0.55; }
.badge-btn.selected { border: 1px solid #C9A461; opacity: 1; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.cancel-btn { flex: 1; background: rgba(58,46,30,0.045); border: 1px solid #DECBA0; border-radius: 10px;
  padding: 12px; color: #4F4030; cursor: pointer; font-weight: 600; }
.save-btn { flex: 2; background: linear-gradient(135deg,#C9A461,#8F6D33); border: none; border-radius: 10px;
  padding: 12px; color: #14100A; cursor: pointer; font-weight: 700; }
.crop-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; display: flex;
  flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
.crop-frame { position: relative; overflow: hidden; background: #F0E6D2; border: 2px solid #C9A461;
  border-radius: 12px; touch-action: none; }
.crop-frame img { position: absolute; top: 0; left: 0; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.crop-controls { margin-top: 16px; width: 100%; max-width: 320px; }
.crop-zoom-row { display: flex; align-items: center; gap: 10px; color: #4F4030; font-size: 14px; }
.crop-hint { color: #8C7A5A; font-size: 11px; text-align: center; margin-top: 6px; }

.login-title { font-family: Georgia, 'Times New Roman', serif; color: #3A2E1E; font-size: 22px; margin: 10px 0 4px; }

.login-error { color: #C24E4E; font-size: 12px; margin-top: 10px; min-height: 16px; }
.pw-eye-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none;
  border: none; cursor: pointer; font-size: 15px; padding: 4px; }

/* ---------- Actors Sync page ---------- */
.actor-toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.actor-sort-btn { background: rgba(58,46,30,0.035); border: 1px solid #DECBA0; border-radius: 20px;

.actor-sort-btn.active { background: linear-gradient(135deg,#C9A461,#8F6D33); color: #14100A; border-color: transparent; }
.birthday-banner { background: linear-gradient(135deg, rgba(201,164,97,0.18), rgba(201,164,97,0.06));
  border: 1px solid #C9A461; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
.birthday-banner-title { font-family: Georgia, 'Times New Roman', serif; color: #3A2E1E; font-size: 16px;

.birthday-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; }

.birthday-item-name { color: #3A2E1E; font-size: 13px; font-weight: 600; }

.conflict-card { background: rgba(194,78,78,0.06); border: 1px solid rgba(194,78,78,0.35); border-radius: 14px;
  padding: 14px; margin-bottom: 12px; }
.conflict-name { color: #3A2E1E; font-family: Georgia, 'Times New Roman', serif; font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.conflict-row { font-size: 12px; color: #5E5140; padding: 3px 0; border-top: 1px dashed #E3D5B4; }
.conflict-row:first-of-type { border-top: none; }
.conflict-field { color: #C24E4E; font-weight: 700; }
.actor-list { background: rgba(58,46,30,0.03); border: 1px solid rgba(58,46,30,0.10); border-radius: 16px; overflow: hidden; }
.actor-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-bottom: 1px solid #E3D5B4; }
.actor-row:last-child { border-bottom: none; }
.actor-row-left { display: flex; flex-direction: column; align-items: center; width: 84px; flex-shrink: 0; text-align: center; }
.actor-row-pic { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: #F0E6D2; flex-shrink: 0;

/* ---------- Login sticker carousel ---------- */
.sticker-track-wrap { position: relative; width: 100%; overflow: hidden; height: 84px; margin-bottom: 4px;
  -webkit-mask-image: linear-gradient(to right, transparent, black 12%, black 88%, transparent);
  mask-image: linear-gradient(to right, transparent, black 12%, black 88%, transparent); }
.sticker-track { display: flex; gap: 14px; position: absolute; top: 0; left: 0; animation: stickerScroll 28s linear infinite; }
.sticker-face { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
  border: 2px solid #C9A461; box-shadow: 0 2px 10px rgba(201,164,97,0.35); background: #F0E6D2; }
@keyframes stickerScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* ---------- Favorite Actor profile snapshot & highlight grids ---------- */
.profile-snapshot { background: linear-gradient(135deg, rgba(201,164,97,0.10), rgba(201,164,97,0.03));
  border: 1px solid #C9A461; border-radius: 16px; padding: 16px; margin-bottom: 18px; }

.snapshot-row { display: flex; gap: 10px; padding: 5px 0; font-size: 13px; }

.snapshot-label { color: #8C7A5A; font-weight: 600; flex-shrink: 0; min-width: 92px; }
.snapshot-value { color: #3A2E1E; }
.highlight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }

.highlight-card-num { color: #9C6B21; font-size: 11px; font-weight: 700; }
.highlight-card-title { color: #3A2E1E; font-size: 12.5px; font-weight: 700; margin: 2px 0 4px; line-height: 1.3; }
.highlight-card-desc { color: #7A6B4E; font-size: 11.5px; line-height: 1.4; }

/* ---------- Crush page: tagline, crush meter, bubbles, speech bubbles ---------- */
.crush-tagline { color: #F0E6D2; font-size: 12.5px; font-style: italic; font-family: Georgia, 'Times New Roman', serif;
  margin: 2px 0 4px; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
.crush-meter { display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, rgba(233,140,161,0.14), rgba(201,164,97,0.08));

.crush-meter:active { transform: scale(0.95); }
